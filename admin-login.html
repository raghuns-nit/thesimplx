<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        <title>Admin Login - Simplx World</title>
        <link rel="stylesheet" href="css/style.css?v=3" />
        <link rel="stylesheet" href="css/admin.css?v=3" />
    </head>
    <body class="login-page">
        <div class="login-card">
            <img class="login-logo mb-4" src="logo.svg" alt="Simplx World" />
            <h1 class="mb-2">Admin Portal</h1>
            <p class="text-muted mb-8">
                Sign in with your admin email and password.
            </p>

            <form id="loginForm" onsubmit="return false;">
                <div class="mb-4">
                    <input
                        type="email"
                        id="loginEmail"
                        class="form-control"
                        placeholder="Admin email"
                        required
                        style="width:100%; padding:0.75rem; border:1px solid var(--border); border-radius:var(--radius); font-size:1rem;"
                    />
                </div>
                <div class="mb-4">
                    <input
                        type="password"
                        id="loginPassword"
                        class="form-control"
                        placeholder="Password"
                        required
                        style="width:100%; padding:0.75rem; border:1px solid var(--border); border-radius:var(--radius); font-size:1rem;"
                    />
                </div>
                <button
                    id="loginBtn"
                    type="submit"
                    class="btn btn-primary btn-block"
                    style="padding: 0.75rem; font-size: 1rem"
                    onclick="doLogin(event)"
                >
                    Sign In
                </button>
                <button
                    id="signupBtn"
                    type="button"
                    class="btn btn-outline btn-block"
                    style="padding: 0.75rem; font-size: 1rem; margin-top: 0.75rem"
                    onclick="doSignup()"
                >
                    Create Admin Account
                </button>
            </form>

            <p
                id="errorMsg"
                class="mt-4"
                style="color: var(--danger); display: none"
            ></p>

            <div class="mt-8" style="font-size: 0.875rem">
                <a href="index.html">&larr; Back to Website</a>
            </div>
        </div>

        <script src="js/supabase-client.js?v=3"></script>
        <script src="js/storage.js?v=3"></script>
        <script src="js/auth.js?v=3"></script>
        <script src="js/activity.js?v=3"></script>
        <script>
            function showAuthError(message) {
                const errEl = document.getElementById('errorMsg');
                errEl.innerText = message;
                errEl.style.display = 'block';
            }

            async function doLogin(event) {
                event.preventDefault();
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;

                if (!email || !password) {
                    showAuthError('Please enter your email and password.');
                    return;
                }

                const result = await handleLogin(email, password);
                if (result.success) {
                    await logActivity('LOGIN', 'user', STATE.userEmail);
                    window.location.href = 'admin.html?v=3';
                } else {
                    showAuthError(result.message || 'Login failed.');
                }
            }

            async function doSignup() {
                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;

                if (!email || password.length < 6) {
                    showAuthError('Enter an email and a password with at least 6 characters.');
                    return;
                }

                const result = await handleSignUp(email, password);
                if (result.success) {
                    window.location.href = 'admin.html?v=3';
                } else {
                    showAuthError(result.message || 'Account creation failed.');
                }
            }

            // If already logged in, redirect to dashboard
            window.addEventListener('supabaseReady', async function () {
                const valid = await validateAdminSession();
                if (valid) window.location.href = 'admin.html?v=3';
            });
        </script>
    </body>
</html>
